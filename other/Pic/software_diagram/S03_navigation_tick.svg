 font-weight="400" fill="#4A5568" text-anchor="start">In the Obstacle Challenge, unparking, the relocalization walk or parking can take over</text><text x="186" y="888" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A5568" text-anchor="start">the drive commands. Pure Pursuit is paused during those manoeuvres, so commands never compete.</text></svg>