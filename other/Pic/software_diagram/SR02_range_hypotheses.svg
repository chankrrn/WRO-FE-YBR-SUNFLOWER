<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-label="Figure SR-02 - One image height, three possible distances"><title>Figure SR-02 - One image height, three possible distances</title><defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1B2A41" flood-opacity="0.07"/></filter></defs><rect width="1200" height="590" fill="#FFFFFF"/><text x="60" y="62" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0F1B2D">Same image height h<tspan font-size="13" dy="5">px</tspan><tspan dy="-5"> → three possible distances</tspan></text><text x="60" y="88" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A5568" text-anchor="start">Side view, schematic. Every sign has the same 50 mm base; only the height changes.</text><clipPath id="clip2"><rect x="880" y="30" width="260" height="90" rx="14"/></clipPath><rect x="880" y="30" width="260" height="90" rx="14" fill="#F1F5FC" filter="url(#shadow)"/><rect x="880" y="30" width="6" height="90" fill="#2D61B5" clip-path="url(#clip2)"/><rect x="880.5" y="30.5" width="259" height="89" rx="13.5" fill="none" stroke="#E1E6EE"/><text x="904" y="70" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1B2D">d<tspan font-size="13" dy="5">H</tspan><tspan dy="-5"> ≈ f</tspan><tspan font-size="13" dy="5">y</tspan><tspan dy="-5"> · H / h</tspan><tspan font-size="13" dy="5">px</tspan></text><text x="904" y="102" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A5568" text-anchor="start">H ∈ {50, 100, 150} mm</text><path d="M150,310 L880,205.7 L880,414.3 Z" fill="#2D61B5" fill-opacity="0.06"/><line x1="150" y1="310" x2="880" y2="205.7" stroke="#2D61B5" stroke-width="1.6" stroke-dasharray="6 6"/><line x1="150" y1="310" x2="880" y2="414.3" stroke="#2D61B5" stroke-width="1.6" stroke-dasharray="6 6"/><rect x="92" y="288" width="46" height="44" rx="8" fill="#5B687C"/><circle cx="144" cy="310" r="12" fill="#FFFFFF" stroke="#5B687C" stroke-width="4"/><text x="115" y="358" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#4A5568" text-anchor="middle">Camera</text><rect x="360" y="280.0" width="60" height="60.0" rx="4" fill="#D64B3C" fill-opacity="0.88" stroke="#A8352A" stroke-width="1.5"/><text x="390" y="266.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#0F1B2D" text-anchor="middle">50 mm sign</text><line x1="360" y1="346.0" x2="360" y2="520" stroke="#0E8A6D" stroke-dasharray="3 4"/><line x1="144" y1="520" x2="350" y2="520" stroke="#0E8A6D" stroke-width="2"/><path d="M349,514 L360,520 L349,526 Z" fill="#0E8A6D"/><circle cx="144" cy="520" r="3.5" fill="#0E8A6D"/><text x="380" y="525" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#0E8A6D" text-anchor="start">d₅₀ = ½ · d₁₀₀</text><text x="506.79999999999995" y="525" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8A94A6" text-anchor="start">closer than a normal sign would be</text><rect x="570" y="250.0" width="60" height="120.0" rx="4" fill="#D64B3C" fill-opacity="0.88" stroke="#A8352A" stroke-width="1.5"/><text x="600" y="236.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#0F1B2D" text-anchor="middle">100 mm (normal)</text><line x1="570" y1="376.0" x2="570" y2="480" stroke="#2D61B5" stroke-dasharray="3 4"/><line x1="144" y1="480" x2="560" y2="480" stroke="#2D61B5" stroke-width="2"/><path d="M559,474 L570,480 L559,486 Z" fill="#2D61B5"/><circle cx="144" cy="480" r="3.5" fill="#2D61B5"/><text x="590" y="485" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#2D61B5" text-anchor="start">d₁₀₀</text><text x="634.8" y="485" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8A94A6" text-anchor="start">the detector's default assumption</text><rect x="780" y="220.0" width="60" height="180.0" rx="4" fill="#D64B3C" fill-opacity="0.88" stroke="#A8352A" stroke-width="1.5"/><text x="810" y="206.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#0F1B2D" text-anchor="middle">150 mm sign</text><line x1="780" y1="406.0" x2="780" y2="440" stroke="#6A4FB8" stroke-dasharray="3 4"/><line x1="144" y1="440" x2="770" y2="440" stroke="#6A4FB8" stroke-width="2"/><path d="M769,434 L780,440 L769,446 Z" fill="#6A4FB8"/><circle cx="144" cy="440" r="3.5" fill="#6A4FB8"/><text x="800" y="445" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#6A4FB8" text-anchor="start">d₁₅₀ = 1.5 · d₁₀₀</text><text x="951.4" y="445" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8A94A6" text-anchor="start">farther than a normal sign would be</text></svg>