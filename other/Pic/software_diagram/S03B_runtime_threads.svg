<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Figure S-03B - Runtime threads and shared data"><title>Figure S-03B - Runtime threads and shared data</title><defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1B2A41" flood-opacity="0.07"/></filter></defs><rect width="1200" height="800" fill="#FFFFFF"/><clipPath id="clip0"><rect x="60" y="40" width="340" height="140" rx="14"/></clipPath><rect x="60" y="40" width="340" height="140" rx="14" fill="#F1F5FC" filter="url(#shadow)"/><rect x="60" y="40" width="6" height="140" fill="#2D61B5" clip-path="url(#clip0)"/><rect x="60.5" y="40.5" width="339" height="139" rx="13.5" fill="none" stroke="#E1E6EE"/><text x="86" y="75" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2D61B5" text-anchor="start" letter-spacing="1.4">THREAD · LIDAR</text><text x="86" y="106" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0F1B2D" text-anchor="start">LiDAR reader</text><text x="86" y="132" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A5568" text-anchor="start">Reads the S2L over UART</text><text x="86" y="152" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A5568" text-anchor="start">at 1,000,000 baud (~10 Hz spin)</text><path d="M230,180 L230,210" fill="none" stroke="#2D61B5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M222,208 L230,220 L238,208 Z" fill="#2D61B5"/><clipPath id="clip10"><rect x="430" y="40" width="340" height="140" rx="14"/></clipPath><rect x="430" y="40" width="340" height="140" rx="14" fill="#FDF5F2" filter="url(#shadow)"/><rect x="430" y="40" width="6" height="140" fill="#C9503A" clip-path="url(#clip10)"/><rect x="430.5" y="40.5" width="339" height="139" rx="13.5" fill="none" stroke="#E1E6EE"/><text x="456" y="75" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#C9503A" text-anchor="start" letter-spacing="1.4">THREAD · MOTOR-ODOMETRY</text><text x="456" y="106" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0F1B2D" text-anchor="start">Odometry</text><text x="456" y="132" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A5568" text-anchor="start">Polls the encoder every 10 ms</text><text x="456" y="152" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A5568" text-anchor="start">Integrates shaft angle · runaway check</text><path d="M600,180 L600,210" fill="none" stroke="#C9503A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M592,208 L600,220 L608,208 Z" fill="#C9503A"/><clipPath id="clip20"><rect x="800" y="40" width="340" height="140" rx="14"/></clipPath><rect x="800" y="40" width="340" height="140" rx="14" fill="#F0F8F5" filter="url(#shadow)"/><rect x="800" y="40" width="6" height="140" fill="#0E8A6D" clip-path="url(#clip20)"/><rect x="800.5" y="40.5" width="339" height="139" rx="13.5" fill="none" stroke="#E1E6EE"/><text x="826" y="75" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0E8A6D" text-anchor="start" letter-spacing="1.4">THREAD · VISION (OBSTACLE)</text><text x="826" y="106" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0F1B2D" text-anchor="start">Vision worker</text><text x="826" y="132" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A5568" text-anchor="start">Capture → HSV detect → map</text><text x="826" y="152" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A5568" text-anchor="start">Capped at 30 Hz</text><path d="M970,180 L970,210" fill="none" stroke="#0E8A6D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M962,208 L970,220 L978,208 Z" fill="#0E8A6D"/><clipPath id="clip30"><rect x="60" y="220" width="340" height="84" rx="14"/></clipPath><rect x="60" y="220" width="340" height="84" rx="14" fill="#F5F7F9" filter="url(#shadow)"/><rect x="60" y="220" width="6" height="84" fill="#5B687C" clip-path="url(#clip30)"/><rect x="60.5" y="220.5" width="339" height="83" rx="13.5" fill="none" stroke="#E1E6EE"/><text x="86" y="255" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#5B687C" text-anchor="start" letter-spacing="1.4">SHARED STATE</text><text x="86" y="284" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#0F1B2D" text-anchor="start">Rolling 360° scan</text><clipPath id="clip36"><rect x="430" y="220" width="340" height="84" rx="14"/></clipPath><rect x="430" y="220" width="340" height="84" rx="14" fill="#F5F7F9" filter="url(#shadow)"/><rect x="430" y="220" width="6" height="84" fill="#5B687C" clip-path="url(#clip36)"/><rect x="430.5" y="220.5" width="339" height="83" rx="13.5" fill="none" stroke="#E1E6EE"/><text x="456" y="255" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#5B687C" text-anchor="start" letter-spacing="1.4">SHARED STATE</text><text x="456" y="284" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#0F1B2D" text-anchor="start">Shaft position and rpm</text><clipPath id="clip42"><rect x="800" y="220" width="340" height="84" rx="14"/></clipPath><rect x="800" y="220" width="340" height="84" rx="14" fill="#F5F7F9" filter="url(#shadow)"/><rect x="800" y="220" width="6" height="84" fill="#5B687C" clip-path="url(#clip42)"/><rect x="800.5" y="220.5" width="339" height="83" rx="13.5" fill="none" stroke="#E1E6EE"/><text x="826" y="255" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#5B687C" text-anchor="start" letter-spacing="1.4">SHARED STATE</text><text x="826" y="284" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#0F1B2D" text-anchor="start">BlockMap sign tracks</text><path d="M230,304 L230.0,328.0 Q230,340 242.0,340.0 L600,340" fill="none" stroke="#2D61B5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M600,304 L600,340" fill="none" stroke="#C9503A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M970,304 L970.0,328.0 Q970,340 958.0,340.0 L600,340" fill="none" stroke="#0E8A6D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M600,340 L600,366" fill="none" stroke="#5B687C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M592,364 L600,376 L608,364 Z" fill="#5B687C"/><circle cx="600" cy="340" r="5" fill="#5B687C" stroke="#FFFFFF" stroke-width="2"/><rect x="342.8" y="328" width="144.4" height="24" rx="12" fill="#FFFFFF" stroke="#5B687C" stroke-width="1.3"/><text x="415" y="344.3" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#5B687C" text-anchor="middle" letter-spacing="0.5">read under locks</text><clipPath id="clip56"><rect x="60" y="376" width="1080" height="230" rx="14"/></clipPath><rect x="60" y="376" width="1080" height="230" rx="14" fill="#F6F3FD" filter="url(#shadow)"/><rect x="60" y="376" width="6" height="230" fill="#6A4FB8" clip-path="url(#clip56)"/><rect x="60.5" y="376.5" width="1079" height="229" rx="13.5" fill="none" stroke="#E1E6EE"/><text x="86" y="411" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#6A4FB8" text-anchor="start" letter-spacing="1.4">MAIN THREAD · BASETASK</text><text x="86" y="444" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1B2D" text-anchor="start">Control loop — 20 ms target (50 Hz)</text><circle cx="98" cy="465" r="11" fill="#6A4FB8"/><text x="98" y="469.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="120" y="470" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4A5568" text-anchor="start">Front clearance from the latest scan</text><circle cx="98" cy="497" r="11" fill="#6A4FB8"/><text x="98" y="501.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="120" y="502" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4A5568" text-anchor="start">Report motion, then get the pose (particle-filter update with the BNO055 when the pose is older than 80 ms)</text><circle cx="98" cy="529" r="11" fill="#6A4FB8"/><text x="98" y="533.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="120" y="534" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4A5568" text-anchor="start">Route progress, Pure Pursuit, speed and safety checks</text><circle cx="98" cy="561" r="11" fill="#6A4FB8"/><text x="98" y="565.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="120" y="566" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4A5568" text-anchor="start">Send one drive and one steering command</text><path d="M600,606 L600,634" fill="none" stroke="#C9503A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M592,632 L600,644 L608,632 Z" fill="#C9503A"/><clipPath id="clip76"><rect x="60" y="644" width="1080" height="70" rx="14"/></clipPath><rect x="60" y="644" width="1080" height="70" rx="14" fill="#FDF5F2" filter="url(#shadow)"/><rect x="60" y="644" width="6" height="70" fill="#C9503A" clip-path="url(#clip76)"/><rect x="60.5" y="644.5" width="1079" height="69" rx="13.5" fill="none" stroke="#E1E6EE"/><text x="86" y="685" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0F1B2D" text-anchor="start">DFR0592 motor HAT  ·  DFR0604 steering servo</text><text x="1114" y="685" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8A94A6" text-anchor="end">I²C bus 1</text><text x="60" y="752" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8A94A6" text-anchor="start">Late ticks are not caught up: if the loop falls more than one period behind, the scheduler resynchronizes.</text><text x="60" y="774" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8A94A6" text-anchor="start">The camera worker and the control loop do not update at the same instant; the loop always reads the newest data.</text></svg>