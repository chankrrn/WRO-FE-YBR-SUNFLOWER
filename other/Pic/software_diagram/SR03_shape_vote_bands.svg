<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Figure SR-03 - Shape-vote bands for the corrected height-to-width ratio"><title>Figure SR-03 - Shape-vote bands for the corrected height-to-width ratio</title><defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1B2A41" flood-opacity="0.07"/></filter></defs><rect width="1200" height="470" fill="#FFFFFF"/><text x="60" y="62" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0F1B2D" text-anchor="start">Corrected ratio ρ = h′ / w′  →  shape vote</text><text x="60" y="88" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A5568" text-anchor="start">Gaps between the bands give no shape decision. Nominal ratios: 1, 2 and 3.</text><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#B8C0CC" stroke-width="2"/></pattern></defs><rect x="379.0" y="250" width="85.0" height="56" fill="url(#hatch)"/><text x="421.50000000000006" y="328" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8A94A6" text-anchor="middle">no decision</text><rect x="736.0" y="250" width="85.0" height="56" fill="url(#hatch)"/><text x="778.5" y="328" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8A94A6" text-anchor="middle">no decision</text><rect x="90.0" y="250" width="289.0" height="56" rx="8" fill="#0E8A6D" fill-opacity="0.14" stroke="#0E8A6D" stroke-width="1.5"/><text x="234.50000000000003" y="275" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0E8A6D" text-anchor="middle">50 mm vote</text><text x="234.50000000000003" y="295" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="middle">ρ ≤ 1.35</text><rect x="464.0" y="250" width="272.0" height="56" rx="8" fill="#2D61B5" fill-opacity="0.14" stroke="#2D61B5" stroke-width="1.5"/><text x="600.0" y="275" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#2D61B5" text-anchor="middle">100 mm vote</text><text x="600.0" y="295" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="middle">ρ 1.60 – 2.40</text><rect x="821.0" y="250" width="289.0" height="56" rx="8" fill="#6A4FB8" fill-opacity="0.14" stroke="#6A4FB8" stroke-width="1.5"/><text x="965.5" y="275" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#6A4FB8" text-anchor="middle">150 mm vote</text><text x="965.5" y="295" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="middle">ρ ≥ 2.65</text><line x1="90" y1="346" x2="1110" y2="346" stroke="#4A5568" stroke-width="1.5"/><line x1="90.0" y1="340" x2="90.0" y2="352" stroke="#4A5568" stroke-width="1.5"/><text x="90.0" y="372" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="middle">0.5</text><line x1="260.0" y1="340" x2="260.0" y2="352" stroke="#4A5568" stroke-width="1.5"/><text x="260.0" y="372" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="middle">1</text><line x1="430.0" y1="340" x2="430.0" y2="352" stroke="#4A5568" stroke-width="1.5"/><text x="430.0" y="372" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="middle">1.5</text><line x1="600.0" y1="340" x2="600.0" y2="352" stroke="#4A5568" stroke-width="1.5"/><text x="600.0" y="372" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="middle">2</text><line x1="770.0" y1="340" x2="770.0" y2="352" stroke="#4A5568" stroke-width="1.5"/><text x="770.0" y="372" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="middle">2.5</text><line x1="940.0" y1="340" x2="940.0" y2="352" stroke="#4A5568" stroke-width="1.5"/><text x="940.0" y="372" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="middle">3</text><line x1="1110.0" y1="340" x2="1110.0" y2="352" stroke="#4A5568" stroke-width="1.5"/><text x="1110.0" y="372" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="middle">3.5</text><rect x="240.0" y="196" width="40" height="40" rx="3" fill="#D64B3C" fill-opacity="0.88" stroke="#A8352A" stroke-width="1.2"/><line x1="260.0" y1="238" x2="260.0" y2="250" stroke="#0E8A6D" stroke-width="1.5"/><line x1="260.0" y1="306" x2="260.0" y2="340" stroke="#0E8A6D" stroke-dasharray="3 4"/><rect x="580.0" y="156" width="40" height="80" rx="3" fill="#D64B3C" fill-opacity="0.88" stroke="#A8352A" stroke-width="1.2"/><line x1="600.0" y1="238" x2="600.0" y2="250" stroke="#2D61B5" stroke-width="1.5"/><line x1="600.0" y1="306" x2="600.0" y2="340" stroke="#2D61B5" stroke-dasharray="3 4"/><rect x="920.0" y="116" width="40" height="120" rx="3" fill="#D64B3C" fill-opacity="0.88" stroke="#A8352A" stroke-width="1.2"/><line x1="940.0" y1="238" x2="940.0" y2="250" stroke="#6A4FB8" stroke-width="1.5"/><line x1="940.0" y1="306" x2="940.0" y2="340" stroke="#6A4FB8" stroke-dasharray="3 4"/><text x="60" y="440" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8A94A6" text-anchor="start">A shape vote also needs a valid pose, an unclipped detection, a candidate range of 200–800 mm and an off-axis angle within 50°.</text></svg>