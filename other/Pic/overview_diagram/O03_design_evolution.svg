<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Figure O-03 - Design evolution"><title>Figure O-03 - Design evolution</title><defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1B2A41" flood-opacity="0.07"/></filter></defs><rect width="1200" height="640" fill="#FFFFFF"/><text x="60" y="60" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0F1B2D" text-anchor="start">Generation 1</text><text x="200" y="60" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8A94A6" text-anchor="start">V1.1 – V1.3 · National Final robot</text><clipPath id="clip2"><rect x="60" y="80" width="340" height="116" rx="14"/></clipPath><rect x="60" y="80" width="340" height="116" rx="14" fill="#F5F7F9" filter="url(#shadow)"/><rect x="60" y="80" width="6" height="116" fill="#5B687C" clip-path="url(#clip2)"/><rect x="60.5" y="80.5" width="339" height="115" rx="13.5" fill="none" stroke="#E1E6EE"/><text x="82" y="118" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#0F1B2D" text-anchor="start">V1.1</text><rect x="308" y="100" width="70" height="24" rx="6" fill="#FFFFFF" stroke="#5B687C" stroke-opacity="0.35"/><text x="343.0" y="116.3" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace" font-size="12.5" font-weight="600" fill="#5B687C" text-anchor="middle">28:28</text><text x="82" y="148" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A5568" text-anchor="start">Printed chassis, drivetrain</text><text x="82" y="169" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A5568" text-anchor="start">and steering prototype</text><clipPath id="clip11"><