Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0F1B2D" text-anchor="start">Generation 2</text><text x="200" y="400" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8A94A6" text-anchor="start">V2.1 – V2.4 · International Final robot</text><clipPath id="clip44"><rect x="60" y="420" width="255" height="116" rx="14"/></clipPath><rect x="60" y="420" width="255" height="116" rx="14" fill="#F5F7F9" filter="url(#shadow)"/><rect x="60" y="420" width="6" height="116" fill="#5B687C" clip-path="url(#clip44)"/><rect x="60.5" y="420.5" width="254" height="115" rx="13.5" fill="none" stroke="#E1E6EE"/><text x="82" y="458" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#0F1B2D" text-anchor="start">V2.1</text><text x="82" y="488" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A5568" text-anchor="start">Initial overhaul prototype</text><clipPath id="clip50"><rect x="335" y="420" width="255" height="116" rx="14"/></clipPath><rect x="335" y="420" width="255" height="116" rx="14" fill="#F5F7F9" filter="url(#shadow)"/><rect x="335" y="420" width="6" height="116" fill="#5B687C" clip-path="url(#clip50)"/><rect x="335.5" y="420.5" width="254" height="115" rx="13.5" fill="none" stroke="#E1E6EE"/><text x="357" y="458" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#0F1B2D" text-anchor="start">V2.2</text><text x="357" y="488" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A5568" text-anchor="start">Upgraded steering and</text><text x="357" y="509" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A5568" text-anchor="start">sensor mounting points</text><clipPath id="clip57"><rect x="610" y="420" width="255" height="116" rx="14"/></clipPath><rect x="610" y="420" width="255" height="116" rx="14" fill="#F5F7F9" filter="url(#shadow)"/><rect x="610" y="420" width="6" height="116" fill="#5B687C" clip-path="url(#clip57)"/><rect x="610.5" y="420.5" width="254" height="115" rx="13.5" fill="none" stroke="#E1E6EE"/><text x="632" y="458" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#0F1B2D" text-anchor="start">V2.3</text><text x="632" y="488" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A5568" text-anchor="start">Repositioned sensors</text><text x="632" y="509" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A5568" text-anchor="start">and wiring</text><clipPath id="clip64"><rect x="885" y="420" width="255" height="116" rx="14"/></clipPath><rect x="885" y="420" width="255" height="116" rx="14" fill="#F1F5FC" filter="url(#shadow)"/><rect x="885" y="420" width="6" height="116" fill="#2D61B5" clip-path="url(#clip64)"/><rect x="885.5" y="420.5" width="254" height="115" rx="13.5" fill="none" stroke="#E1E6EE"/><text x="907" y="458" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#0F1B2D" text-anchor="start">V2.4</text><rect x="1048" y="440" width="70" height="24" rx="6" fill="#FFFFFF" stroke="#2D61B5" stroke-opacity="0.35"/><text x="1083.0" y="456.3" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace" font-size="12.5" font-weight="600" fill="#2D61B5" text-anchor="middle">18:28</text><text x="1038" y="458" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#2D61B5" text-anchor="end">current</text><text x="907" y="488" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4A5568" text-anchor="start">Supporti