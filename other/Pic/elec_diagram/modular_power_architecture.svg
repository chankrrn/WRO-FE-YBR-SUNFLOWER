="start" letter-spacing="1.4">M1 / E1 PROPULSION</text><text x="646" y="1015" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0F1B2D" text-anchor="start">CHP-20GP-180</text><text x="646" y="1043" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4A5568" text-anchor="start">Geared motor + encoder</text><rect x="646" y="1057" width="112" height="24" rx="6" fill="#FFFFFF" stroke="#2D61B5" stroke-opacity="0.35"/><text x="702.0" y="1073.3" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace" font-size="12.5" font-weight="600" fill="#2D61B5" text-anchor="middle">M1+ / M1−</text><text x="772" y="1074" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4A5568" text-anchor="start">Propulsion terminal</text><rect x="646" y="1091" width="112" height="24" rx="6" fill="#FFFFFF" stroke="#2D61B5" stroke-opacity="0.35"/><text x="702.0" y="1107.3" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace" font-size="12.5" font-weight="600" fill="#2D61B5" text-anchor="middle">E1A / E1B</text><text x="772" y="1108" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4A5568" text-anchor="start">Feedback terminal</text><rect x="646" y="1125" width="112" height="24" rx="6" fill="#FFFFFF" stroke="#2D61B5" stroke-opacity="0.35"/><text x="702.0" y="1141.3" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace" font-size="12.5" font-weight="600" fill="#2D61B5" text-anchor="middle">E1+ / E1−</text><text x="772" y="1142" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4A5568" text-anchor="start">Encoder supply</text><clipPath id="clip114"><rect x="60" y="1206" width="1080" height="76" rx="14"/></clipPath><rect x="60" y="1206" width="1080" height="